/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let talents = [...defaultTalents];
let activeCategory = 'all';

/* ═══════════════════════════════════════════
   SUPABASE — try live, fallback to defaults
   ═══════════════════════════════════════════ */
(async () => {
  try {
    if (typeof supabase !== 'undefined' && supabase.createClient) {
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data, error } = await sb.from('talents').select('*').eq('enabled', true);
      if (!error && data && data.length > 0) {
        talents = data;
      }
    }
  } catch (_) { /* use defaults */ }
  renderGrid();
})();

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
const grid = document.getElementById('talentGrid');

function renderGrid() {
  const filtered = activeCategory === 'all'
    ? talents.filter(t => t.enabled !== false)
    : talents.filter(t => t.category === activeCategory && t.enabled !== false);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No se encontraron talentos en esta categoría.</div>';
    return;
  }

  grid.innerHTML = filtered.map((t, i) => {
    const cat = CATEGORIES[t.category] || { label: t.category, color: '#FA257E' };
    const icon = CATEGORY_ICONS[t.category] || '';
    const delay = (i % 12) * 0.06;
    const imgHTML = t.image
      ? `<img class="card-img" src="${t.image}" alt="${t.name}" loading="lazy"/>`
      : `<div class="card-placeholder" style="background:linear-gradient(135deg, ${cat.color}22 0%, #111116 100%)">${icon}</div>`;

    return `
      <article class="talent-card" style="animation-delay:${delay}s" data-id="${t.id}" onclick="openModal('${t.id}')">
        <div class="card-visual">
          ${imgHTML}
          <div class="card-gradient"></div>
          <span class="card-badge" style="background:${cat.color}cc">${cat.label}</span>
          <div class="card-content">
            <h3 class="card-name">${t.name}</h3>
            <div class="card-meta">
              <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${t.duration}</span>
              <span>${t.price}</span>
            </div>
          </div>
        </div>
      </article>`;
  }).join('');
}

/* ═══════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════ */
document.getElementById('filterScroll').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeCategory = pill.dataset.cat;
  renderGrid();
});

/* ═══════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════ */
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');

function openModal(id) {
  const t = talents.find(x => x.id === id);
  if (!t) return;
  const cat = CATEGORIES[t.category] || { label: t.category, color: '#FA257E' };
  const icon = CATEGORY_ICONS[t.category] || '';

  document.getElementById('modalImageWrap').innerHTML = t.image
    ? `<img class="modal-image" src="${t.image}" alt="${t.name}"/>`
    : `<div class="modal-image-placeholder" style="background:linear-gradient(135deg, ${cat.color}22 0%, #111116 100%)">${icon}</div>`;

  document.getElementById('modalBadge').textContent = cat.label;
  document.getElementById('modalBadge').style.background = cat.color + 'cc';
  document.getElementById('modalName').textContent = t.name;
  document.getElementById('modalDuration').textContent = t.duration;
  document.getElementById('modalPrice').textContent = t.price;
  document.getElementById('modalDesc').textContent = t.description;
  document.getElementById('modalPriceLarge').textContent = t.price;

  const msg = encodeURIComponent(`Hola MAR Entertainment, me interesa el servicio: ${t.name}. Me gustaría recibir más información.`);
  document.getElementById('modalCta').href = `https://wa.me/${WA_NUMBER}?text=${msg}`;

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══════════════════════════════════════════
   STICKY FILTER SHADOW
   ═══════════════════════════════════════════ */
const filterBar = document.getElementById('filterBar');
const observer = new IntersectionObserver(
  ([entry]) => filterBar.classList.toggle('stuck', !entry.isIntersecting),
  { rootMargin: '-73px 0px 0px 0px', threshold: 0 }
);
observer.observe(document.querySelector('.hero'));
</script>
