<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MAR Admin — Login</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/jpeg" href="../favicon.jpeg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: #050505; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
  .login-card {
    background: rgba(17, 17, 22, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 400px;
    margin: 1rem;
  }
  .login-input {
    width: 100%;
    padding: 0.75rem 1rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: #FA257E; }
  .login-input::placeholder { color: #71717A; }
  .login-btn {
    width: 100%;
    padding: 0.75rem;
    background: #FA257E;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-btn:active { transform: scale(0.98); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .eye-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #71717A;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .eye-btn:hover { color: #A1A1AA; }
  .error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <!-- Logo -->
  <div style="text-align: center; margin-bottom: 2rem;">
    <img src="../logo-mar.jpeg" alt="MAR Entertainment" style="height: 40px; margin: 0 auto 1rem; display: block; border-radius: 6px;"/>
    <h1 style="font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: #fff; margin: 0;">MAR Admin</h1>
    <p style="color: #71717A; font-size: 12px; margin-top: 4px;">Entertainment Group — Panel de gestión</p>
  </div>

  <!-- Error -->
  <div id="errorMsg" class="error-msg"></div>

  <!-- Form -->
  <form id="loginForm" autocomplete="on">
    <div style="margin-bottom: 1rem;">
      <label style="display: block; color: #A1A1AA; font-size: 12px; font-weight: 500; margin-bottom: 6px;">Email</label>
      <input type="email" id="emailInput" class="login-input" placeholder="admin@marentertainment.com" required autocomplete="email"/>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; color: #A1A1AA; font-size: 12px; font-weight: 500; margin-bottom: 6px;">Contraseña</label>
      <div style="position: relative;">
        <input type="password" id="passwordInput" class="login-input" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 44px;"/>
        <button type="button" class="eye-btn" id="togglePassword" title="Mostrar contraseña" onclick="const pw=document.getElementById('passwordInput');const isP=pw.type==='password';pw.type=isP?'text':'password';document.getElementById('eyeOff').style.display=isP?'none':'block';document.getElementById('eyeOn').style.display=isP?'block':'none';">
          <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          <svg id="eyeOn" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span id="btnText">Ingresar</span>
      <span class="spinner" id="btnSpinner" style="margin: 0 auto;"></span>
    </button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; color: #71717A; font-size: 11px;">
    <a href="/" style="color: #71717A; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#FA257E'" onmouseout="this.style.color='#71717A'">← Volver al sitio</a>
  </p>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ===== CONFIG — replace with your Supabase credentials =====
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== Check if already logged in =====
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data: role } = await sb.from('user_roles').select('role').eq('user_id', session.user.id).single();
    if (role && role.role === 'admin') {
      window.location.href = '/admin/leads.html';
    }
  }
})();

// ===== Toggle password visibility =====
const toggleBtn = document.getElementById('togglePassword');
const pwInput = document.getElementById('passwordInput');
const eyeOff = document.getElementById('eyeOff');
const eyeOn = document.getElementById('eyeOn');

toggleBtn.addEventListener('click', () => {
  const isPassword = pwInput.type === 'password';
  pwInput.type = isPassword ? 'text' : 'password';
  eyeOff.style.display = isPassword ? 'none' : 'block';
  eyeOn.style.display = isPassword ? 'block' : 'none';
});

// ===== Login form =====
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const loginBtn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');
const btnSpinner = document.getElementById('btnSpinner');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  loginBtn.disabled = true;
  btnText.style.display = 'none';
  btnSpinner.style.display = 'block';

  const email = document.getElementById('emailInput').value.trim();
  const password = pwInput.value;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // Check admin role
    const { data: role, error: roleErr } = await sb.from('user_roles').select('role').eq('user_id', data.user.id).single();
    if (roleErr || !role || role.role !== 'admin') {
      await sb.auth.signOut();
      throw new Error('No tenés permisos de administrador.');
    }

    window.location.href = '/admin/leads.html';
  } catch (err) {
    errorMsg.textContent = err.message === 'Invalid login credentials'
      ? 'Email o contraseña incorrectos.'
      : err.message || 'Error al iniciar sesión.';
    errorMsg.style.display = 'block';
    loginBtn.disabled = false;
    btnText.style.display = 'inline';
    btnSpinner.style.display = 'none';
  }
});
</script>

</body>
</html>
